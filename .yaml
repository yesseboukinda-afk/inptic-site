name: Déploiement Automatique LWS

on:
  push:
    branches:
      - main # Remplacez par 'master' si votre branche principale sur GitHub s'appelle master

jobs:
  web-deploy:
    name: Sync Fichiers
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Récupérer le code du dépôt
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🚀 Synchroniser vers LWS via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        local-dir: ./
        server-dir: /inptic-site/
