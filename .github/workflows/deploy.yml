# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploiement automatique LWS

'on':
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: Construire et synchroniser le site
    runs-on: ubuntu-24.04
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Configurer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Construire l'application Next.js
        run: npm run build:next

      - name: Preparer le runtime Passenger autonome
        run: |
          cp -a public .next/standalone/
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/

      - name: Conserver les anciens chunks et ajouter ceux du build
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from ftplib import FTP, error_perm
          from pathlib import Path

          local_root = Path(".next/standalone/.next/static")
          if not local_root.is_dir():
              raise SystemExit("Le dossier des ressources Next.js est introuvable.")

          server = os.environ["FTP_SERVER"].removeprefix("ftp://").removeprefix("ftps://").split("/", 1)[0]
          ftp = FTP(timeout=60)
          ftp.connect(server, 21)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])

          remote_root = ("inptic-site", ".next", "standalone", ".next", "static")
          for local_file in sorted(local_root.rglob("*")):
              if not local_file.is_file():
                  continue

              remote_directories = (*remote_root, *local_file.relative_to(local_root).parent.parts)
              ftp.cwd("/")
              for directory in remote_directories:
                  try:
                      ftp.cwd(directory)
                  except error_perm:
                      ftp.mkd(directory)
                      ftp.cwd(directory)

              with local_file.open("rb") as file:
                  ftp.storbinary(f"STOR {local_file.name}", file)

          ftp.quit()
          PY

      - name: Synchroniser vers LWS via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /inptic-site/
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
            .next/cache/**
            **/.env*
            **/.npmrc
            **/.yarnrc*
            **/*.pem
            **/*.key
            **/playwright.config.*
            **/drizzle.config.*
            chatbot/vercel*.json
            chatbot/components.json
            .next/standalone/.next/static/**

      - name: Redemarrer Passenger apres le deploiement
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from ftplib import FTP, error_perm
          from io import BytesIO

          server = os.environ["FTP_SERVER"].removeprefix("ftp://").removeprefix("ftps://").split("/", 1)[0]
          ftp = FTP(timeout=60)
          ftp.connect(server, 21)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          ftp.cwd("/")

          cache_path = ("inptic-site", ".next", "standalone", ".next", "server", "route-cache")
          for directory in cache_path[:-1]:
              ftp.cwd(directory)

          try:
              ftp.cwd(cache_path[-1])
          except error_perm:
              cache_name = cache_path[-1]
              entries = {entry.rsplit("/", 1)[-1] for entry in ftp.nlst()}
              if cache_name in entries:
                  raise
              print("No persisted Next.js route cache to clear.")
          else:
              def clear_directory():
                  for entry in ftp.nlst():
                      name = entry.rsplit("/", 1)[-1]
                      if name in (".", ".."):
                          continue

                      try:
                          ftp.cwd(name)
                      except error_perm:
                          ftp.delete(name)
                      else:
                          clear_directory()
                          ftp.cwd("..")
                          ftp.rmd(name)

              clear_directory()
              ftp.cwd("..")
              ftp.rmd(cache_path[-1])
              print("Cleared the persisted Next.js route cache.")

          ftp.cwd("/")
          ftp.cwd("inptic-site")

          try:
              ftp.cwd("tmp")
          except error_perm:
              ftp.mkd("tmp")
              ftp.cwd("tmp")

          restart_marker = BytesIO(f"{os.environ['GITHUB_SHA']}\n".encode())
          ftp.storbinary("STOR restart.txt", restart_marker)
          ftp.quit()
          PY
