name: Déploiement Automatique LWS

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: Sync Fichiers
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Récupérer le code du dépôt
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ⚙️ Préparer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: 📦 Installer les dépendances
      run: npm ci

    - name: 🏗️ Construire l'application Next.js
      run: npm run build:next

    - name: 🚀 Synchroniser vers LWS via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        local-dir: ./
        server-dir: /inptic-site/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          .next/cache/**
