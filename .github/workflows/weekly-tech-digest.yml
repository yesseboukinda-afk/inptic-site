name: Envoi de la revue IT hebdomadaire

on:
  schedule:
    - cron: '0 16 * * 5'
  workflow_dispatch:

jobs:
  send-weekly-digest:
    name: Envoyer la revue du vendredi
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la configuration
        env:
          DIGEST_URL: ${{ vars.NEWSLETTER_DIGEST_URL }}
          CRON_SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
        run: |
          if [ -z "$DIGEST_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure NEWSLETTER_DIGEST_URL as a repository variable and NEWSLETTER_CRON_SECRET as a repository secret."
            exit 1
          fi

      - name: Envoyer la revue par e-mail
        env:
          DIGEST_URL: ${{ vars.NEWSLETTER_DIGEST_URL }}
          CRON_SECRET: ${{ secrets.NEWSLETTER_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST "$DIGEST_URL" \
            --header "Authorization: Bearer $CRON_SECRET"
